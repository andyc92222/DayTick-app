[project]
name = "daytick"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "psycopg[binary]>=3.2,<4",
  "PyJWT[crypto]>=2.10,<3", "pwdlib[argon2]>=0.2,<1",
  "httpx>=0.28,<1", "email-validator>=2.2,<3", "tzdata>=2025.1"
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-timeout>=2.3,<3", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
timeout = 60

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
