version: '3.8'
x-environment: &environment
  DB_HOST: postgres
  DB_NAME: daytick
  JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public
  JWT_ISSUER: daytick-auth
  JWT_AUDIENCE: daytick-api
  APP_TIMEZONE: ${APP_TIMEZONE:-Australia/Brisbane}
x-deploy: &deploy
  replicas: 2
  endpoint_mode: vip
  placement:
    preferences:
      - spread: node.labels.daytick.host
  restart_policy:
    condition: any
    delay: 5s
  update_config:
    parallelism: 1
    delay: 15s
    order: start-first
    failure_action: rollback
    monitor: 45s
  rollback_config:
    parallelism: 1
    order: stop-first
    monitor: 45s
  resources:
    limits: {cpus: '1.0', memory: 512M}
    reservations: {memory: 128M}
x-health: &health
  test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
  interval: 15s
  timeout: 5s
  start_period: 30s
  retries: 3
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: daytick
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password, auth_db_password, task_db_password, timer_db_password]
    configs:
      - source: postgres_init
        target: /docker-entrypoint-initdb.d/01-init.sh
    volumes:
      - type: bind
        source: /srv/daytick/postgres
        target: /var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d daytick']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      placement:
        constraints: ['node.labels.daytick.db == true']
      restart_policy: {condition: any, delay: 5s}
      update_config: {parallelism: 1, order: stop-first, failure_action: rollback}
      rollback_config: {parallelism: 1, order: stop-first}
      resources:
        limits: {memory: 1G}
        reservations: {memory: 256M}
  auth:
    image: ${REGISTRY}/daytick-auth:${TAG}
    environment:
      <<: *environment
      AUTH_DB_PASSWORD_FILE: /run/secrets/auth_db_password
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private
      JWT_TTL_SECONDS: 3600
    secrets: [auth_db_password, jwt_public, jwt_private]
    networks: [backend]
    healthcheck: *health
    deploy: *deploy
  task:
    image: ${REGISTRY}/daytick-task:${TAG}
    environment:
      <<: *environment
      TASK_DB_PASSWORD_FILE: /run/secrets/task_db_password
      INTERNAL_TOKEN_FILE: /run/secrets/internal_token
      TIMER_URL: http://timer:8000
    secrets: [task_db_password, jwt_public, internal_token]
    networks: [backend]
    healthcheck: *health
    deploy: *deploy
  timer:
    image: ${REGISTRY}/daytick-timer:${TAG}
    environment:
      <<: *environment
      TIMER_DB_PASSWORD_FILE: /run/secrets/timer_db_password
      INTERNAL_TOKEN_FILE: /run/secrets/internal_token
      TASK_URL: http://task:8000
    secrets: [timer_db_password, jwt_public, internal_token]
    networks: [backend]
    healthcheck: *health
    deploy: *deploy
  frontend:
    image: ${REGISTRY}/daytick-frontend:${TAG}
    networks: [edge]
    deploy: *deploy
  gateway:
    image: ${REGISTRY}/daytick-gateway:${TAG}
    networks: [edge, backend]
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
        mode: ingress
    deploy: *deploy
networks:
  edge:
    driver: overlay
    driver_opts: {encrypted: ''}
  backend:
    driver: overlay
    driver_opts: {encrypted: ''}
secrets:
  postgres_password: {external: true, name: daytick_postgres_password_v1}
  auth_db_password: {external: true, name: daytick_auth_db_password_v1}
  task_db_password: {external: true, name: daytick_task_db_password_v1}
  timer_db_password: {external: true, name: daytick_timer_db_password_v1}
  jwt_private: {external: true, name: daytick_jwt_private_v1}
  jwt_public: {external: true, name: daytick_jwt_public_v1}
  internal_token: {external: true, name: daytick_internal_token_v1}
configs:
  postgres_init: {external: true, name: daytick_postgres_init_v1}
