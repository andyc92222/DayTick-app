server {
    listen 8080;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location = /health/live { access_log off; return 200 'ok'; }
    location /internal/ { return 404; }
    location /api/auth/ {
        set $backend auth:8000;
        proxy_pass http://$backend$request_uri;
        include /etc/nginx/proxy_params;
    }
    location /api/tasks {
        set $backend task:8000;
        proxy_pass http://$backend$request_uri;
        include /etc/nginx/proxy_params;
    }
    location /api/timers {
        set $backend timer:8000;
        proxy_pass http://$backend$request_uri;
        include /etc/nginx/proxy_params;
    }
    location / {
        set $backend frontend:8080;
        proxy_pass http://$backend$request_uri;
        include /etc/nginx/proxy_params;
    }
}
